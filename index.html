{ id: 'l-silhouette', name: 'Silhouette', abbr: 'SIL', cat: 'Direction', dur: 6, kind: 'light',
  tags: { mood: ['dramatic', 'isolated', 'reflective'], use: ['performance', 'reveal', 'transition'], gear: ['one LED'], level: 'beginner' },
  summary: 'Light the background, not the face. A dark shape against brightness.', lede: 'A silhouette lights what is behind the subject and nothing in front. The face goes black and the outline does all the work: posture, hair, the shape of a hat. It hides identity and reveals shape.',
  how: ['Aim your light at the background wall, or put a window or bright doorway behind the subject.', 'Kill every light in front. Even a little spill on the face ruins it.', 'Expose for the background so the subject falls to black.', 'Profile poses read better than straight-on.'],
  reads: ['Mystery', 'Shape', 'Anonymity'], implies: 'Withholding. We see the person but not who they are, so it suits intros, reveals, and lyrics about hiding. Also a clean, graphic look for dance.',
  use: ['Intro before the artist is revealed', 'Dance where shape matters more than face', 'Transitions between sections'], avoid: ['Lyrics that need the eyes'],
  practice: 'One light on the wall behind. Subject between light and camera. Expose for the wall. Then turn the subject to profile.',
  quiz: { q: 'What do you expose for in a silhouette?', opts: ['The bright background', 'The face', 'The camera\'s automatic setting'], a: 0, why: 'Exposing for the background pushes the unlit subject to black.' },
  pairs: ['l-rim', 'l-haze', 'l-lowkey'], refs: [['James Bond gun-barrel intros', 'silhouette as identity'], ['Sia\'s videos', 'silhouette and shape']],
  beats: [[0, 'Light aimed at the wall behind. Nothing on the face.'], [.35, 'The face falls to black. The outline is the image.'], [.65, 'A touch of spill sneaks onto the cheek and the effect weakens.'], [.85, 'Flag it off. Pure shape again.']],
  lights: [{ name: 'On the wall', kind: 'led', angle: 160, elev: 20, dist: 1.4, size: .9, power: 1.6, kelvin: 5600, spill: 2.2 }, KEY({ power: [[0, 0], [.6, 0], [.68, .12], [.82, .12], [.9, 0]], angle: -40 })], env: { wallDist: 1.4, ambient: .01, wall: '#8a8f99' },
  notes: [{ k: 'text', t: [.05, .55], text: 'Expose for the wall: the face goes black' }, { k: 'text', t: [.66, .85], text: 'Spill on the cheek weakens it', col: 'or' }] },
{ id: 'l-lowkey', name: 'Low key', abbr: 'LOW', cat: 'Contrast', dur: 7, kind: 'light',
  tags: { mood: ['dramatic', 'tense', 'intimate'], use: ['performance', 'emotion', 'night'], gear: ['one LED'], level: 'beginner' },
  summary: 'One source, deep shadows, mostly darkness. Mood from what you cannot see.', lede: 'Low-key lighting keeps most of the frame dark and lets one source carve out the subject. The ratio between lit and unlit is high, the background falls away, and the mood comes from shadow. Noir, thrillers and dark performance videos live here.',
  how: ['One key, usually from the side and above, fairly small so it does not spill.', 'No fill. Use a black card to kill bounce if the room is bright.', 'Let the background go black: keep the subject away from the wall and the light off it.', 'Expose for the highlights; let the shadows fall.'],
  reads: ['Mystery', 'Threat', 'Intimacy'], implies: 'Something hidden. The dark frame makes the audience lean in and imagine. Very effective with slow songs and confessional lyrics.',
  use: ['Dark, slow verses', 'Menace and secrets', 'Cheap sets: darkness hides everything you cannot afford'], avoid: ['Upbeat, open songs', 'Faces that need to be fully readable for lip-sync'],
  practice: 'Turn every light in the room off. One LED, one subject, two metres from the wall. Find the angle where the least light does the most.',
  quiz: { q: 'What is the low-key trick for cheap locations?', opts: ['Darkness hides the parts of the room you cannot dress', 'It needs more lights', 'It only works outdoors'], a: 0, why: 'What is not lit is not seen.' },
  pairs: ['l-highkey', 'l-split', 'l-rembrandt'], refs: [['Film noir', 'the low-key genre'], ['The Weeknd\'s darker videos', 'single-source performance in the dark']],
  beats: [[0, 'Room dark. One small key from high and to the side.'], [.3, 'Half the face carved out. The background is gone.'], [.6, 'Pull the subject further from the wall: the last of the spill dies.'], [.85, 'Mostly darkness. Mood from what you cannot see.']],
  lights: [KEY({ angle: 55, elev: 40, dist: 1.3, size: .35, spill: .3 })], env: { wallDist: [[0, 1.6], [.55, 1.6], [.75, 3.2]], ambient: .01 },
  notes: [{ k: 'text', t: [.05, .55], text: 'One small key, no fill' }, { k: 'text', t: [.62, 1], text: 'Subject away from the wall: background to black', col: 'or' }] },
{ id: 'l-highkey', name: 'High key', abbr: 'HIGH', cat: 'Contrast', dur: 6, kind: 'light',
  tags: { mood: ['playful', 'energetic', 'neutral'], use: ['performance', 'social', 'beauty'], gear: ['one LED', 'softbox', 'bounce card', 'second light'], level: 'beginner' },
  summary: 'Bright, low contrast, background lit. Clean, upbeat, pop.', lede: 'High-key lighting is the opposite of low key: soft key, plenty of fill, and a background that is lit as bright as the subject or brighter. Few shadows, high energy, nothing hidden. Pop, comedy and product content.',
  how: ['Big soft key close to the camera axis.', 'Strong fill: bounce cards on both sides or a second soft light.', 'Light the background separately so it goes white or a clean colour.', 'Expose bright, just short of clipping skin.'],
  reads: ['Energy', 'Optimism', 'Cleanliness'], implies: 'Nothing to hide. High key says happy, open, commercial. It is the look of pop choruses, adverts and daytime.',
  use: ['Upbeat choruses', 'Colourful pop and dance', 'Product and fashion'], avoid: ['Anything moody', 'Small kits without a background light (the wall will go grey, not white)'],
  practice: 'Softbox near the lens, white cards both sides, LED number two on the wall. Then remove the wall light and see the whole mood drop.',
  quiz: { q: 'What separates high key from flat light?', opts: ['The background is lit bright too', 'It uses a hard key', 'It is only for night'], a: 0, why: 'High key is a whole-frame decision: subject and background both bright.' },
  pairs: ['l-lowkey', 'l-flat', 'l-butterfly'], refs: [['Pop videos on white cycs', 'the high-key chorus'], ['Apple adverts', 'white, bright, shadowless']],
  beats: [[0, 'Soft key near the lens.'], [.3, 'Fill from both sides: shadows nearly gone.'], [.6, 'Background light on: the wall goes bright.'], [.85, 'Bright, open, upbeat. Nothing hidden.']],
  lights: [KEY({ angle: 20, elev: 20, dist: 1.5, size: 1.1, power: .9 }), FILL({ angle: -55, power: [[0, 0], [.25, 0], [.35, .5]] }), { name: 'Background', kind: 'led', angle: 150, elev: 25, dist: 1.6, size: .9, power: [[0, 0], [.55, 0], [.68, 1.3]], kelvin: 5600, spill: 2.4 }], env: { wallDist: 1.6, wall: '#c9ccd4', ambient: .05 },
  notes: [{ k: 'text', t: [.32, .58], text: 'Fill both sides' }, { k: 'text', t: [.62, 1], text: 'Background lit: the frame goes bright', col: 'or' }] },
{ id: 'l-toplight', name: 'Top light', abbr: 'TOP', cat: 'Direction', dur: 6, kind: 'light',
  tags: { mood: ['uneasy', 'dramatic', 'isolated'], use: ['emotion', 'performance', 'reveal'], gear: ['one LED'], level: 'intermediate' },
  summary: 'Light from directly overhead. Eye sockets go dark. Interrogation and isolation.', lede: 'Top light comes from straight above. Brows shadow the eyes, the nose throws a long shadow to the lip, cheekbones jut. It is unflattering by design: interrogation rooms, streetlights, the single bulb.',
  how: ['Hang or boom the light directly above the subject, angled straight down.', 'A small source makes it harsher; a softbox overhead is gentler but still hollows the eyes.', 'A bounce card at chest height rescues the eyes if you want half the effect.'],
  reads: ['Isolation', 'Judgement', 'Exhaustion'], implies: 'Being under scrutiny or under a bare bulb. It strips glamour and makes the subject look tired, guilty or alone. Under a streetlight it reads as night and solitude.',
  use: ['Interrogation and confession', 'A lone figure under a streetlight', 'Making a pretty face look wrecked'], avoid: ['Beauty', 'Any face you want to flatter'],
  practice: 'Light overhead, then slide a white card in at chest height and watch the eyes come back. Where the card sits is your control over how cruel the light is.',
  quiz: { q: 'Why does top light hollow the eyes?', opts: ['The brow blocks light from reaching the sockets', 'The light is too dim', 'The light is too warm'], a: 0, why: 'From above, the brow ridge shadows everything below it.' },
  pairs: ['l-butterfly', 'l-underlight', 'l-lowkey'], refs: [['The Godfather (1972)', 'top-lit eyes in shadow'], ['Streetlight scenes everywhere', 'the overhead practical']],
  beats: [[0, 'Light directly overhead.'], [.3, 'The brow shadows the eyes. Long nose shadow to the lip.'], [.6, 'A card at chest height, angled up.'], [.85, 'The eyes return, the mood softens by half.']],
  lights: [KEY({ angle: 0, elev: 80, dist: 1.2, size: .3 }), FILL({ name: 'Card below', angle: 0, elev: -25, dist: 1.0, power: [[0, 0], [.55, 0], [.68, .35]] })], env: { wallDist: 1.8, ambient: .02 },
  notes: [{ k: 'ring', t: [.25, .55], x: 0, y: 1.63, rx: .07, ry: .02, text: 'eyes in shadow', col: 'or' }, { k: 'text', t: [.62, 1], text: 'Card below rescues the eyes' }] },
{ id: 'l-underlight', name: 'Under light', abbr: 'UNDER', cat: 'Direction', dur: 6, kind: 'light',
  tags: { mood: ['uneasy', 'tense', 'playful'], use: ['emotion', 'reveal'], gear: ['one LED', 'practical'], level: 'beginner' },
  summary: 'Light from below the face. Shadows go the wrong way. Horror, or a phone screen.', lede: 'Light from below reverses every shadow we expect from the sun: the nose shadow goes up, the brow lights from underneath, the chin glows. It is the torch-under-the-chin campfire look, and also, more gently, what a phone or laptop screen does to a face at night.',
  how: ['Light low, below the chin, angled up.', 'Hard and bright for horror. Small and dim, slightly blue, for a phone screen.', 'Keep everything else dark so the reversed shadows read.'],
  reads: ['Menace', 'Unnatural', 'Screen glow'], implies: 'Wrongness. Nothing in nature lights from below except fire and screens, so the brain reads it as sinister or artificial.',
  use: ['Horror and villain beats', 'Phone-at-night scenes', 'Campfire or floor-lamp motivation'], avoid: ['Anything that should look normal'],
  practice: 'Phone torch under the chin. Then hold the phone where a phone would actually be, screen on, in a dark room. Same direction, two moods.',
  quiz: { q: 'Which real source lights a face from below?', opts: ['A phone screen', 'The sun', 'A ceiling light'], a: 0, why: 'Screens held below the face are the everyday version of under light.' },
  pairs: ['l-toplight', 'l-lowkey', 'l-practical'], refs: [['Campfire ghost stories', 'the torch under the chin'], ['Any modern film with texting at night', 'the blue screen glow']],
  beats: [[0, 'Light low, angled up, hard.'], [.3, 'Nose shadow points up. Brow lit from beneath. Wrong.'], [.6, 'Dim it, cool it, shrink it: now it is a phone screen.'], [.85, 'Same direction, two moods.']],
  lights: [KEY({ name: 'From below', angle: 10, elev: -40, dist: 1.0, size: [[0, .15], [.55, .15], [.65, .25]], power: [[0, 1.3], [.55, 1.3], [.65, .35]], kelvin: [[0, 5600], [.55, 5600], [.65, 8500]] })], env: { wallDist: 1.8, ambient: .01 },
  notes: [{ k: 'ring', t: [.25, .55], x: 0, y: 1.63, rx: .05, ry: .03, text: 'shadows reversed', col: 'or' }, { k: 'text', t: [.62, 1], text: 'Dim, cool, small: a phone screen' }] },
{ id: 'l-haze', name: 'Haze and backlight', abbr: 'HAZE', cat: 'Atmosphere', dur: 7, kind: 'light',
  tags: { mood: ['epic', 'dreamy', 'energetic'], use: ['performance', 'night'], gear: ['one LED', 'haze'], level: 'intermediate' },
  summary: 'Fill the air with haze and every light becomes a visible beam.', lede: 'Haze (a fine fog from a hazer, or a can of "atmosphere" spray in a pinch) puts particles in the air that scatter light. Back lights become beams, depth appears in the frame, and a plain room turns into a concert. It is the single biggest production-value trick for a small kit.',
  how: ['Haze the room lightly and let it settle for a few minutes. Even is better than thick.', 'Point lights towards the camera from behind the subject, not from the front: haze only shows up in backlight.', 'Small hard sources make clean beams; softboxes make a glow.', 'Ventilate, and check smoke alarms before you start.'],
  reads: ['Atmosphere', 'Scale', 'Concert'], implies: 'Spectacle and depth. Beams in the air say stage, night, event. It also softens the whole image slightly, which flatters.',
  use: ['Chorus performance', 'Anything meant to feel like a gig', 'Hiding a boring room'], avoid: ['Naturalistic daytime scenes', 'Rooms with sensitive smoke alarms and no ventilation'],
  practice: 'One hard light behind the subject, aimed at the lens, flagged so it does not flare. Add haze in stages and film each stage.',
  quiz: { q: 'Why do beams only appear with backlight?', opts: ['Haze scatters light towards the camera when the source is behind the subject', 'Front light is too weak', 'Haze is only visible at night'], a: 0, why: 'Forward scattering: particles glow when the light is coming towards the lens.' },
  pairs: ['l-rim', 'l-colourrim', 'l-silhouette'], refs: [['Every stadium concert', 'beams through haze'], ['Skyfall (2012)', 'the Shanghai backlit haze sequence']],
  beats: [[0, 'Back light on, no haze: an edge on the hair, nothing in the air.'], [.3, 'Haze builds. The beam appears.'], [.6, 'Depth: the air between subject and wall is now visible.'], [.85, 'A plain room reads as a stage.']],
  lights: [RIM({ angle: 150, elev: 35, dist: 1.8, size: .12, power: 1.3 }), KEY({ angle: -40, elev: 25, power: .4 })], env: { haze: [[0, 0], [.2, 0], [.7, .9]], wallDist: 2.6, ambient: .02 },
  notes: [{ k: 'text', t: [.05, .25], text: 'No haze: nothing in the air' }, { k: 'text', t: [.35, 1], text: 'Haze: the beam appears', col: 'or' }] },
{ id: 'l-ratio', name: 'Lighting ratio', abbr: 'RATIO', cat: 'Contrast', dur: 8, kind: 'light',
  tags: { mood: ['neutral', 'dramatic'], use: ['interview', 'performance', 'dialogue'], gear: ['one LED', 'bounce card'], level: 'intermediate' },
  summary: 'How much darker the shadow side is than the lit side. The dial that sets mood.', lede: 'The ratio between the lit side and the shadow side of a face is the real mood control. 2:1 is soft and open (one stop darker). 4:1 is confident and cinematic (two stops). 8:1 and beyond is drama. You set it with fill: more bounce, lower ratio.',
  how: ['Key in place. Measure or eyeball the shadow side.', 'Bring a white card closer to lower the ratio, further away to raise it.', 'No card, black card, or a black wall for the highest ratios.', 'Decide the ratio before the shoot and keep it consistent across setups.'],
  reads: ['Open', 'Confident', 'Dramatic'], implies: '2:1 says daytime, honesty, comedy. 4:1 says film. 8:1 says night, secrets, noir. Same key, three different films.',
  use: ['Matching the mood across a whole video', 'Keeping interview and performance consistent'], avoid: ['Changing ratio from shot to shot without meaning it'],
  practice: 'Key fixed. Film with the white card at 30cm, 1m, 2m and removed. Label the four clips 2:1, 3:1, 4:1, 8:1 and learn what each feels like.',
  quiz: { q: 'What lowers the lighting ratio?', opts: ['More fill on the shadow side', 'A brighter key', 'A harder key'], a: 0, why: 'Fill lifts the shadow side towards the lit side.' },
  pairs: ['l-lowkey', 'l-highkey', 'l-threepoint'], refs: [['Interview lighting guides', 'the 2:1 to 4:1 range'], ['Noir', '8:1 and up']],
  beats: [[0, 'Key only. Shadow side very dark: about 8:1.'], [.3, 'White card at 1m: about 4:1. Cinematic.'], [.6, 'Card at 30cm: about 2:1. Open, daytime.'], [.85, 'Back to no fill. Same key, a different film.']],
  lights: [KEY({ angle: 45, elev: 30, dist: 1.6 }), FILL({ power: [[0, 0], [.22, 0], [.35, .3], [.5, .3], [.62, .65], [.78, .65], [.9, 0]], dist: [[0, 2], [.5, 2], [.62, .8], [.78, .8], [.9, 2]] })],
  notes: [{ k: 'ratio', t: [.05, .28], text: '8:1' }, { k: 'ratio', t: [.35, .55], text: '4:1' }, { k: 'ratio', t: [.62, .82], text: '2:1' }] },
{ id: 'l-eyelight', name: 'Eye light', abbr: 'EYE', cat: 'Detail', dur: 6, kind: 'light',
  tags: { mood: ['intimate', 'neutral'], use: ['performance', 'dialogue', 'interview'], gear: ['one LED', 'bounce card'], level: 'intermediate' },
  summary: 'A catchlight in each eye. Without it the face looks dead.', lede: 'The little reflection of your light in the eye is the catchlight, and it is what makes a face look alive. If your key is too high or too far to the side, the eyes go dark and flat. A small light or a white card near the lens puts the sparkle back without changing the shape.',
  how: ['Check the eyes on the monitor. No sparkle means no eye light.', 'Lower the key a touch, or add a small source near the lens at low power.', 'A white card below the lens works as a free eye light.', 'Watch the catchlight\'s position: at about 10 or 2 o\'clock in the eye looks natural.'],
  reads: ['Alive', 'Present', 'Connected'], implies: 'Life. A catchlight signals someone is home behind the eyes. Lose it and a performance reads as vacant even when it is not.',
  use: ['Every close-up', 'Any moody setup where the key is high or far to the side'], avoid: ['Big catchlights from a ring light if you want a natural look (they leave a ring in the eye)'],
  practice: 'Rembrandt key, high. Look at the shadow-side eye: dead. Add a small light near the lens at 10%. Watch the eye come back without the shadows changing.',
  quiz: { q: 'What is a catchlight?', opts: ['The reflection of a light source in the eye', 'The key light', 'A lens flare'], a: 0, why: 'That reflection is what reads as life in the eyes.' },
  pairs: ['l-rembrandt', 'l-toplight', 'l-loop'], refs: [['Every studio portrait', 'the catchlight at 10 o\'clock']],
  beats: [[0, 'High key from the side. Good shape, but the eyes are dark.'], [.35, 'A tiny light near the lens at 10%.'], [.6, 'A sparkle in each eye. The shadows have not changed.'], [.85, 'The face is alive.']],
  lights: [KEY({ angle: 55, elev: 45, dist: 1.5, size: .5 }), { name: 'Eye light', kind: 'led', angle: -8, elev: 5, dist: 1.6, size: .15, power: [[0, 0], [.3, 0], [.42, .18]], kelvin: 5600, spill: .2 }], env: { wallDist: 1.8, ambient: .02 },
  notes: [{ k: 'ring', t: [.05, .35], x: -.045, y: 1.63, rx: .02, ry: .02, text: 'dark eye', col: 'or' }, { k: 'ring', t: [.55, 1], x: -.045, y: 1.63, rx: .02, ry: .02, text: 'catchlight' }] },
];

  { id: 'lc-hard-soft', a: 'l-hardsoft', b: 'l-window', title: 'Small LED vs window', lesson: 'Both are a single key from the side. The bare LED is small and far: crisp shadow edges. The window is enormous: shadows fade gently. Softness is size, not power.' },

const PHASE_PLUS = {
  p0: { compares: ['push-zoom'], mv: 'Watch three videos with the sound off. For each, count how many setups cover one chorus. Most use four to six.' , lights: [] },
  p1: { lights: ['l-window', 'l-hardsoft'], compares: ['shallow-deep'], mv: 'Shoot every test at 25p with a 1/50 shutter. Then shoot one at 100p and slow it down in Resolve: that is the speed-ramp look you will use on chorus hits.' },
  p2: { lights: ['l-ratio', 'l-mixed'], compares: [], mv: 'Log needs light. Expose skin bright, bring it down in the grade. The "cinematic" S-Log3 look is mostly correct exposure plus one contrast curve.' },
  p3: { lights: ['l-window', 'l-loop', 'l-rembrandt', 'l-broad'], compares: ['cu-wide', 'sym-neg', 'lc-remb-butter'], mv: 'Build the standard performance ladder: wide (whole body), medium (waist up), close (face), and one "weird" shot (low, through something, fisheye). Four setups per section is your coverage minimum.' },
  p4: { lights: ['l-hardsoft'], compares: ['pan-truck', 'tilt-crane', 'hh-steadi'], mv: 'Movement should match tempo. Slow songs: push in, pull out, slow arc. Fast songs: handheld, whip, crash zoom. Try one chorus with a move that fights the tempo and feel why it is wrong.' },

const LS_KEY = 'shotbook.v1';
let store = { favs: [], lists: [] };
const Sync = { db: null, ref: null, mode: 'local', saving: false, pending: false, timer: null };
function lsRead() { try { const v = localStorage.getItem(LS_KEY); return v ? JSON.parse(v) : null; } catch { return null; } }
function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch {} }
function setSync(txt) { const el = $('#sync'); if (el) el.textContent = txt; }
function save() {
  lsWrite();
  if (!Sync.ref) { setSync('Saved in this browser'); return; }
  clearTimeout(Sync.timer); setSync('Saving…');
  Sync.timer = setTimeout(flush, 700);
}
async function flush() {
  if (Sync.saving) { Sync.pending = true; return; }
  Sync.saving = true;
  try { await Sync.ref.set(JSON.parse(JSON.stringify(store))); setSync('Saved to your account'); }
  catch (e) {
    if (e && e.code === 'unavailable') { setTimeout(flush, 1500 + Math.random() * 1000); }
    else { Sync.ref = null; setSync('Saved in this browser'); }
  }
  Sync.saving = false;
  if (Sync.pending) { Sync.pending = false; flush(); }
}
async function connect() {
  if (!window.claude || !claude.use) { setSync('Saved in this browser'); return; }
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { setSync('Saved in this browser'); return; }
    const ref = db.doc('data/users/' + uid + '/shotbook');
    const snap = await ref.get();
    Sync.db = db; Sync.ref = ref;
    if (snap.exists) {
      const d = snap.data();
      store = { favs: [...(d.favs || [])], lists: JSON.parse(JSON.stringify(d.lists || [])) };
      lsWrite(); setSync('Saved to your account'); rerender();
    } else { flush(); }
  } catch { setSync('Saved in this browser'); }
}

function shuffleIdx(n, seedStr) { let h = 0; for (const c of seedStr) h = (h * 31 + c.charCodeAt(0)) >>> 0; const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

}
function drawDetail() {

  if (cs && !$('#pset').hidden) { if (cs.width < 10) fit(cs); S = Engine.diagram(cs.getContext('2d'), cs.width, cs.height, s, det.t); }
  S = S || Engine.state(s, det.t);

  const tc = $('#tc'); if (tc) tc.textContent = tcode(det.t * s.dur);
  const c = S.cam, tg = S.A && S.A.show ? S.A : S.B;

  const P = [['Lens', Math.round(c.f) + 'mm'], ['Height', c.y.toFixed(2) + 'm'], ['To subject', dist.toFixed(1) + 'm'], ['Tilt', Math.round(c.tilt) + '°']];
  if (Math.abs(c.roll) > .5 || s.id === 'dutch') P[3] = ['Roll', Math.round(c.roll) + '°'];

}

/* glossary tooltips: wrap known terms in the lesson text */
function glossify(html) {
  const re = new RegExp('(?<![\\w-])(' + GLOSS_KEYS.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\w-])', 'gi');
  const seen = new Set();
  return html.replace(/>([^<]+)</g, (m, txt) => '>' + txt.replace(re, (t) => { const k = t.toLowerCase(); if (seen.has(k)) return t; seen.add(k); return `<button class="gl" data-gl="${esc(k)}" type="button">${t}</button>`; }) + '<');
}
function showGloss(btn) {

  let x = Math.min(innerWidth - pw - 16, Math.max(16, r.left)), y = r.bottom + 8; if (y + ph > innerHeight - 16) y = Math.max(16, r.top - ph - 8);

}

/* ---------- coverage check for a shot list ---------- */
function coverageCheck(l) {
  const secField = l.fields.find(f => /section/i.test(f.name)); const groups = {};
  for (const it of l.items) { const k = secField ? (it.vals[secField.id] || 'Unassigned') : 'Whole list'; (groups[k] = groups[k] || []).push(it); }
  const out = [];
  for (const k in groups) { const ids = groups[k].map(i => i.shotId); const has = pred => ids.some(id => BY_ID[id] && pred(BY_ID[id])); const miss = [];
    if (!has(s => ['ews', 'ws'].includes(s.id))) miss.push('no wide');
    if (!has(s => ['ms', 'mcu'].includes(s.id))) miss.push('no medium');
    if (!has(s => ['cu', 'ecu'].includes(s.id))) miss.push('no close-up');
    if (!has(s => s.cat === 'Movement')) miss.push('no camera move');
    if (!groups[k].some(i => i.light || (BY_ID[i.shotId] && BY_ID[i.shotId].kind === 'light'))) miss.push('no lighting decided');
    if (!groups[k].some(i => i.loc)) miss.push('no location');
    out.push({ k, n: groups[k].length, miss }); }
  return out;
}
function coverageHTML(l) { if (!l.items.length) return ''; const r = coverageCheck(l); const bad = r.filter(x => x.miss.length); return `<div class="box cover"><h4>Coverage check ${bad.length ? `<span class="count" style="background:var(--bad-soft);color:var(--bad)">${bad.length}</span>` : '<span class="count" style="background:var(--good-soft);color:var(--good)">ok</span>'}</h4><p>Each section wants a wide, a medium, a close-up, one move, a lighting decision and a location.</p><div class="fl">${r.map(x => `<div class="covrow ${x.miss.length ? 'bad' : 'ok'}"><b>${esc(x.k)}</b><span class="mono">${x.n} shots</span><span>${x.miss.length ? esc(x.miss.join(' · ')) : 'covered'}</span></div>`).join('')}</div></div>`; }
/* ---------- Editing library: cut patterns shown as a real cut between engine shots, with a timeline ---------- */
const EditEngine = (() => {
  const MONO = '"IBM Plex Mono", ui-monospace, monospace';
  // pattern: { bpm, bars, clips:[{shot, start(beat), end(beat), t0, t1, trans?('cut'|'dissolve'), audioLead?}] , sfx? }
  function clipAt(pat, beat) { let cur = null; for (const c of pat.clips) if (beat >= c.start && beat < c.end) cur = c; return cur || pat.clips[pat.clips.length - 1]; }
  const totalBeats = pat => pat.bars * 4;
  function renderShot(ctx, W, H, c, u, sh) { const s = BY_ID[c.shot]; const t = (c.t0 == null ? 0 : c.t0) + ((c.t1 == null ? 1 : c.t1) - (c.t0 == null ? 0 : c.t0)) * u; if (s.kind === 'light') LightEngine.frame(ctx, W, H, s, t % 1, { notes: false }); else Engine.render(ctx, W, H, s, t % 1, { notes: false, guides: {}, mini: sh }); }
  let off = null;
  function frame(ctx, W, H, pat, t, opts = {}) {
    const TB = totalBeats(pat), beat = t * TB; const c = clipAt(pat, beat); const u = (beat - c.start) / (c.end - c.start);
    renderShot(ctx, W, H, c, u, opts.mini);
    // dissolve: blend the next clip in over the last beat
    const nx = pat.clips[pat.clips.indexOf(c) + 1];
    if (nx && nx.trans === 'dissolve' && beat > c.end - 1) { if (!off) off = document.createElement('canvas'); off.width = W; off.height = H; renderShot(off.getContext('2d'), W, H, nx, 0, opts.mini); ctx.globalAlpha = beat - (c.end - 1); ctx.drawImage(off, 0, 0); ctx.globalAlpha = 1; }
    // flash on cut for the first few frames (a subtle white edge) so cuts read in motion
    const since = beat - c.start; if (since < .08 && c !== pat.clips[0] && !opts.mini) { ctx.fillStyle = `rgba(255,255,255,${(1 - since / .08) * .18})`; ctx.fillRect(0, 0, W, H); }
    if (!opts.mini) { const fs = Math.max(10, W * .017); ctx.font = `${fs}px ${MONO}`; const lab = c.label || `Clip ${pat.clips.indexOf(c) + 1}: ${BY_ID[c.shot].name}`; const w = ctx.measureText(lab).width; ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(8, H - fs - 14, w + 12, fs + 8); ctx.fillStyle = '#EFA23E'; ctx.fillText(lab, 14, H - 10);
      // beat flash dot
      const inBeat = beat % 1; const strong = Math.floor(beat) % 4 === 0; ctx.fillStyle = `rgba(108,195,209,${Math.max(0, 1 - inBeat * 3) * (strong ? 1 : .55)})`; ctx.beginPath(); ctx.arc(W - 18, 18, strong ? 7 : 5, 0, 7); ctx.fill(); }
    return { beat, clip: c };
  }
  // timeline: video track (clips), audio track (waveform with beats), playhead, cut markers
  function timeline(ctx, W, H, pat, t) {
    const TB = totalBeats(pat), beat = t * TB; ctx.fillStyle = '#0B0D11'; ctx.fillRect(0, 0, W, H);
    const L = 54, R = W - 14, X = b => L + (R - L) * b / TB; const vy = H * .18, vh = H * .3, ay = H * .58, ah = H * .26;
    const lab = (txt, x, y, col, al = 'left') => { ctx.fillStyle = col; ctx.font = `${Math.max(9, W * .02)}px ${MONO}`; ctx.textAlign = al; ctx.fillText(txt, x, y); ctx.textAlign = 'left'; };
    lab('VIDEO', 10, vy + vh / 2 + 4, '#8E959F'); lab('AUDIO', 10, ay + ah / 2 + 4, '#8E959F');
    // bars and beats
    for (let b = 0; b <= TB; b++) { const x = X(b); const bar = b % 4 === 0; ctx.strokeStyle = bar ? 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.08)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, vy - 8); ctx.lineTo(x, ay + ah + 6); ctx.stroke(); if (bar && b < TB) lab(`bar ${b / 4 + 1}`, x + 3, vy - 12, '#6B727C'); }
    // audio waveform: pulses on beats, bigger on the downbeat, plus the song's "sections"
    ctx.fillStyle = '#23798A';
    for (let x = L; x < R; x += 2) { const b = (x - L) / (R - L) * TB; const ib = b % 1; const strong = Math.floor(b) % 4 === 0; const env = Math.exp(-ib * 5) * (strong ? 1 : .55); const hit = pat.hits && pat.hits.some(h => Math.abs(h - b) < .12) ? 1.6 : 1; const n = (Math.sin(x * 12.9898) * 43758.5453) % 1; const amp = (.18 + .82 * env) * hit * (0.6 + .4 * Math.abs(n)) * ah / 2 * (pat.quiet && b < pat.quiet ? .18 : 1); ctx.fillRect(x, ay + ah / 2 - amp, 2, amp * 2); }

    lab(`${pat.bpm} bpm · bar ${Math.floor(beat / 4) + 1} beat ${Math.floor(beat % 4) + 1}`, R, H - 8, '#8E959F', 'right');
    lab('▲ cut on the beat', L, H - 8, '#6CC3D1'); lab('▲ cut off the beat', L + W * .22, H - 8, '#EFA23E');
    return { beat };
  }
  return { frame, timeline, totalBeats };
})();
