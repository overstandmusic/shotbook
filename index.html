<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111317"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="robots" content="noindex,nofollow"><style>html{color-scheme:light dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><title>Shotbook</title>
<meta name="description" content="A shot library for music video and film, with animated lessons and shot lists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E9ECEF; --surface:#FBFBFC; --surface2:#EEF1F4; --ink:#111418; --muted:#454C57; --faint:#6E7580;
  --line:#D2D7DE; --accent:#B4600C; --accent-ink:#FFFFFF; --accent-soft:#F6E3CC; --cyan:#23798A; --cyan-soft:#D5ECF0;
  --good:#2F7D4F; --good-soft:#DBEFE2; --bad:#B23A3A; --bad-soft:#F6DCDC;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 8px 24px rgba(20,24,30,.08);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111317; --surface:#191C22; --surface2:#20242B; --ink:#F2EFE8; --muted:#B9BFC9; --faint:#8A919C;
  --line:#2C3139; --accent:#EFA23E; --accent-ink:#1A1206; --accent-soft:#3A2A14; --cyan:#6CC3D1; --cyan-soft:#16343A;
  --good:#6CC08A; --good-soft:#18301F; --bad:#E07A7A; --bad-soft:#3A1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111317; --surface:#191C22; --surface2:#20242B; --ink:#F2EFE8; --muted:#B9BFC9; --faint:#8A919C;
  --line:#2C3139; --accent:#EFA23E; --accent-ink:#1A1206; --accent-soft:#3A2A14; --cyan:#6CC3D1; --cyan-soft:#16343A;
  --good:#6CC08A; --good-soft:#18301F; --bad:#E07A7A; --bad-soft:#3A1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
:root[data-text="large"] #app,:root[data-text="large"] #sheet,:root[data-text="large"] #pop{zoom:1.15}
:root[data-text="xl"] #app,:root[data-text="xl"] #sheet,:root[data-text="xl"] #pop{zoom:1.32}
:root[data-contrast="high"]{--muted:#20242B;--faint:#3E444E;--line:#9AA1AB;--bg:#F4F5F7;--surface:#FFFFFF}
@media (prefers-color-scheme:dark){:root[data-contrast="high"]:not([data-theme="light"]){--muted:#E6E3DC;--faint:#C2C7CF;--line:#5A616C;--bg:#0B0D10;--surface:#15181D;--ink:#FFFFFF}}
:root[data-theme="dark"][data-contrast="high"]{--muted:#E6E3DC;--faint:#C2C7CF;--line:#5A616C;--bg:#0B0D10;--surface:#15181D;--ink:#FFFFFF}
:root[data-contrast="high"] .label,:root[data-contrast="high"] .tag{font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono)}
.wrap{max-width:1360px;margin:0 auto;padding-inline:20px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.04em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:22px;height:16px;border:2px solid var(--accent);border-radius:3px;position:relative}
.brand i:after{content:"";position:absolute;inset:3px 5px;border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.count{font-family:var(--mono);font-size:11px;background:var(--surface2);color:var(--muted);border-radius:99px;padding:1px 7px}
.tab[aria-selected="true"] .count{background:var(--accent);color:var(--accent-ink)}
.sync{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}

/* generic controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{border-color:var(--faint)}
.iconbtn.on{color:var(--accent);border-color:var(--accent)}
.iconbtn svg,.btn svg{width:16px;height:16px}
input.field,select.field,textarea.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;width:100%}
textarea.field{resize:vertical;min-height:64px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:11px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--faint)}
.search input{padding-left:34px}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag{font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:5px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.mood{background:var(--accent-soft);color:var(--accent)}
.tag.gear{background:var(--cyan-soft);color:var(--cyan)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* library */
.lib{display:grid;grid-template-columns:250px 1fr;gap:28px;padding-block:24px 60px}
.filters{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:20px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup .chips{display:flex;flex-wrap:wrap;gap:6px}
.fhead{display:flex;justify-content:space-between;align-items:center}
.libmain{min-width:0;display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .search{min-width:200px}
.resline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.activef{display:flex;flex-wrap:wrap;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--faint)}
.thumb{position:relative;aspect-ratio:16/9;background:#0C0E12;cursor:pointer;display:block;width:100%;border:0;padding:0}
.thumb canvas{width:100%;height:100%;display:block}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.ctitle{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ctitle h3{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;cursor:pointer}
.ctitle .abbr{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap;padding-top:3px}
.csum{color:var(--muted);font-size:14.5px;line-height:1.45;margin:0}
.ctags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
.cact{display:flex;gap:6px;padding:0 14px 14px}
.cact .btn{flex:1;justify-content:center}
.fav svg{fill:none}
.chip svg{width:13px;height:13px}
.fav.on svg{fill:currentColor}

/* mobile filter drawer */
.fbtn{display:none}
@media (max-width:860px){
  .lib{grid-template-columns:1fr}
  .filters{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);max-height:none;z-index:40;background:var(--surface);padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .2s}
  .filters.open{transform:none}
  .fbtn{display:inline-flex}
  .top .wrap{gap:10px}
  .sync{display:none}
}
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.5);z-index:35}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:stretch;justify-content:center;background:rgba(8,10,14,.62);padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.sheetin{background:var(--surface);border-radius:14px;width:100%;max-width:1240px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheetbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.shotnav{flex:none;display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.backbtn{font-weight:600}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--faint);white-space:nowrap;overflow:hidden}
.crumbs button{border:0;background:none;padding:0;color:var(--muted)}
.crumbs button:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.stagecol{background:#0E1014;color:#E9E4D8;padding:20px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.stagehead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.viewseg{display:flex;background:#1C2027;border-radius:8px;padding:3px}
.viewseg button{border:0;background:none;color:#9CA3AE;padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:600}
.viewseg button[aria-pressed="true"]{background:#2D333D;color:#F3EEE3}
.stagebox{display:grid;gap:10px}
.stagebox.both{grid-template-columns:1fr}
.panel{position:relative;border-radius:8px;overflow:hidden;background:#07080A}
.panel canvas{display:block;width:100%;height:auto}
.pwrap{display:flex;flex-direction:column;gap:6px}
.phead{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8E959F}
.phead .tc{color:#EFA23E;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.transport{display:flex;align-items:center;gap:10px}
.transport .iconbtn{background:#1C2027;border-color:#2D333D;color:#F3EEE3}
.transport input[type=range]{flex:1;accent-color:#EFA23E}
.transport select{background:#1C2027;border:1px solid #2D333D;color:#F3EEE3;border-radius:8px;padding:5px 6px;font-size:12.5px}
.guides{display:flex;gap:6px;flex-wrap:wrap}
.guides button{border:1px solid #2D333D;background:#15181D;color:#9CA3AE;border-radius:99px;font-size:12px;padding:3px 10px}
.guides button[aria-pressed="true"]{color:#EFA23E;border-color:#EFA23E}
.beats{display:flex;flex-direction:column;gap:2px;border-top:1px solid #262A31;padding-top:10px}
.beat{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:6px 8px;border-radius:6px;font-size:14.5px;line-height:1.45;color:#A9B0BA;border:0;background:none;text-align:left;transition:background .2s,color .2s}
.beat .t{font-family:var(--mono);font-size:11px;color:#6B727C;padding-top:2px}
.beat.on{background:#1C2027;color:#F3EEE3}
.beat.on .t{color:#EFA23E}
.params{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.param{background:#15181D;border-radius:6px;padding:6px 8px}
.param .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6B727C}
.param .v{font-family:var(--mono);font-size:13px;color:#F3EEE3;font-variant-numeric:tabular-nums}
.infocol{padding:26px 28px 34px;display:flex;flex-direction:column;gap:22px;min-width:0;overflow:auto;position:relative}
.infohead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.infohead h2{font-family:var(--display);font-weight:800;font-size:44px;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.infohead .aka{color:var(--muted);font-size:13px;margin-top:6px}
.infoact{display:flex;gap:8px;flex-wrap:wrap}
.lede{font-size:18px;line-height:1.55;margin:0;max-width:62ch}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:500}
.sec p{margin:0;max-width:65ch;color:var(--ink);font-size:15.5px}
.sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;max-width:65ch}
.implies{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px}
.implies .reads{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.implies .reads span{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.02em;color:var(--accent)}
.implies .reads span+span:before{content:"/";margin-right:6px;opacity:.5}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.use li::marker{content:"+  ";color:var(--good);font-weight:600}
.avoid li::marker{content:"–  ";color:var(--bad);font-weight:600}
.practice{border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px}
.quiz{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.quiz .q{font-weight:600}
.quiz .opts{display:flex;flex-direction:column;gap:6px}
.quiz .opts button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px}
.quiz .opts button.right{border-color:var(--good);background:var(--good-soft)}
.quiz .opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.quiz .why{font-size:14px;color:var(--muted)}
.pairs{display:flex;flex-wrap:wrap;gap:6px}
.pairs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:500}
.pairs button:hover{border-color:var(--accent);color:var(--accent)}
.refs li{color:var(--muted)}
.refs li b{color:var(--ink);font-weight:600}
.stagehead{flex-wrap:wrap}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
@media (max-width:1100px){
  .sheet{padding:0}
  .sheetin{display:block;border-radius:0;overflow:auto}
  .sheetbody{display:block}
  .shotnav{position:sticky;top:0;z-index:5;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .infocol{overflow:visible;padding:22px 20px 40px}
  .stagecol{overflow:visible;min-height:auto}
  .stagebox{max-width:760px;margin:0 auto;width:100%}
  .infohead h2{font-size:36px}
  .twocol{grid-template-columns:1fr}
  .params{grid-template-columns:repeat(2,1fr)}
}

/* popover */
.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:300px;max-width:calc(100vw - 32px);padding:12px;display:flex;flex-direction:column;gap:10px}
.pop h5{margin:0;font-size:13px;font-weight:600}
.poplist{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto}
.poplist label{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:14px}
.poplist label:hover{background:var(--surface2)}
.poplist label small{margin-left:auto;color:var(--faint);font-family:var(--mono);font-size:11px}
.poplist input{accent-color:var(--accent);width:16px;height:16px}
.poprow{display:flex;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:90;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* shot lists index */
.lists{padding-block:24px 60px;display:flex;flex-direction:column;gap:16px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead h1{font-family:var(--display);font-weight:800;font-size:44px;text-transform:uppercase;line-height:.95}
.seg{display:inline-flex;background:var(--surface2);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lrows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 180px 150px auto;gap:16px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .lt{cursor:pointer;min-width:0}
.lrow .lt b{font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lt span{font-size:13px;color:var(--muted)}
.lrow .meta{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.prog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px}
.progtxt{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.rowact{display:flex;gap:4px;justify-content:flex-end}
.badge{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:2px}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--bad)}
@media (max-width:760px){
  .lrow{grid-template-columns:1fr auto;gap:10px}
  .lrow .meta,.lrow .pcell{grid-column:1}
  .rowact{grid-column:2;grid-row:1 / span 3;flex-direction:column}
}

/* list detail */
.ldetail{padding-block:20px 60px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
.lhead{grid-column:1 / -1;display:flex;flex-direction:column;gap:12px}
.crumb{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13.5px}
.lhead h1{font-family:var(--display);font-weight:800;font-size:46px;text-transform:uppercase;line-height:.95}
.titleinput{font-family:var(--display);font-weight:800;font-size:40px;text-transform:uppercase;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px 10px;width:100%}
.lsum{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lsum .prog{width:200px}
.ltools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ltools .grow{flex:1}

<script>
/* ---------- Shotbook camera engine v2: a small 3D set rendered as a camera frame and a floor plan ---------- */
const Engine = (() => {
  const SENSOR_W = 36, SENSOR_H = 20.25;

  const PAL = [{ coat: '#D98A3D', coat2: '#B06B28', hair: '#2A1E18' }, { coat: '#4AA3B2', coat2: '#347F8C', hair: '#5E3F26' }, { coat: '#7A6FA8', coat2: '#5B5283', hair: '#1E1A17' }, { coat: '#8C8C8C', coat2: '#6A6A6A', hair: '#3A2A22' }];

{

  reads:['Conversation','Perspective','Connection'],

  avoid:['Crossing the 180° line, which makes characters appear to swap sides','Letting the foreground shoulder take over the frame'],
  practice:'Draw the line between two actors on the floor with tape. Shoot an OTS each way from the same side of the tape, then try one from the wrong side and watch the edit break.',

  implies:'Discovery. A tilt up builds anticipation as we reveal a character or the scale of a building. A tilt down can bring us back to earth or reveal something at someone\'s feet.',

  avoid:['Tilting through empty or boring space','Crooked tilts from an unlevelled head'],
  practice:'Introduce a character with a tilt up from their shoes. Style the shoes to say something about them before we see the face.',
  quiz:{q:'A tilt up from shoes to face is used to…', opts:['Build anticipation before revealing a character','Show a location','Establish the 180° line'], a:0, why:'Holding back the face makes the audience wait for it.'},

  refs:[['Classic "the stranger arrives" intros','boots first, then the face'],['Fashion-led music videos','head-to-toe outfit reveals']],

},
{
  id:'pushin', name:'Push in', abbr:'DOLLY IN', cat:'Movement', dur:7,
  tags:{mood:['tense','intimate','powerful'], use:['emotion','reveal','performance'], gear:['dolly/slider','gimbal'], level:'intermediate'},
  summary:'The camera physically moves towards the subject. Rising importance.',
  lede:'A push in (dolly in) moves the whole camera closer to the subject, usually on a dolly track or slider. As the frame tightens, the audience feels drawn in, as if the moment is getting more important or the character is realising something.',
  how:['Use a dolly, slider or smooth gimbal. Bumps kill the effect.','Move slowly. The best push-ins are almost invisible.','Time it to a turn in the performance: a realisation, a key lyric.','Keep focus on the subject throughout (pull focus as you travel).'],
  reads:['Realisation','Tension','Intimacy'],
  implies:'Growing significance. The audience leans in with the camera. A slow push on a face during a lyric or a line says "this is the moment it lands." Unlike a zoom, the perspective changes, so it feels physical.',
  use:['A key lyric or line landing','A character\'s realisation','Building tension before a drop or reveal'],
  avoid:['Pushing constantly, which becomes wallpaper','Bumpy movement'],
  practice:'Film the same close-up static and with a slow 30cm push in over 8 seconds. Watch both with the sound off and notice where your attention goes.',
  quiz:{q:'How does a dolly-in differ from a zoom-in?', opts:['The perspective changes: foreground passes by and the background grows slowly','Nothing, they look identical','A dolly is always faster'], a:0, why:'Moving the camera changes the spatial relationships (parallax). A zoom only magnifies.'},
  pairs:['pullout','zoom','dollyzoom'],
  refs:[['The Godfather (1972)','slow push on Michael in the restaurant scene'],['Stanley Kubrick\'s films','slow, relentless push-ins']],
  beats:[[0,'Medium shot. The camera starts to travel forward on a track.'],[.35,'The lamp posts in the background grow slower than the subject. That is real perspective.'],[.65,'The frame tightens from medium to close. We are drawn into the moment.'],[.9,'The move lands on the close-up at the key moment.']],
  cam:{z:[[0,0],[.1,0],[.9,3,'c'],[1,3]], y:1.6, f:35, aim:'A', aimY:1.5},
  A:{x:0, z:5, face:0}
},
{

  tags:{mood:['isolated','reflective','vulnerable'], use:['reveal','emotion','transition'], gear:['dolly/slider','gimbal'], level:'intermediate'},
  summary:'The camera moves away, revealing context and leaving the subject behind.',
  lede:'A pull out (dolly out) moves the camera away from the subject. The frame widens to reveal more of the world: the empty room, the crowd, the aftermath. Emotionally it often feels like leaving, or seeing the bigger picture.',
  how:['Plan what the widening frame reveals. The reveal is the point.','Pull out slowly at the end of a scene or song to let the audience exhale.','Watch for crew, lights and track appearing in frame as it widens.'],

  implies:'Distance and aftermath. We step back and see how small the character is, or what surrounds them. It is the emotional opposite of a push in, and a classic final shot.',
  use:['The end of a song or video','Revealing isolation or a surprising context','Letting a moment breathe after an emotional peak'],
  avoid:['Revealing nothing new as the frame widens'],
  practice:'Start close on someone\'s face and pull out to reveal they are the only person in a large space. Then try it revealing a crowd. Same move, opposite meanings.',

  pairs:['pushin','crane','ews'],
  refs:[['Gone with the Wind (1939)','the crane pull-out over the wounded soldiers'],['End shots of many music videos','the artist left alone in frame']],
  beats:[[0,'We begin close on the face.'],[.3,'The camera travels backwards. The world creeps in at the edges.'],[.6,'The empty street appears. The context changes how we read the face.'],[.9,'We leave them behind: small, alone, done.']],
  cam:{z:[[0,3.4],[.1,3.4],[.95,-4,'c'],[1,-4]], y:1.6, f:35, aim:'A', aimY:[[0,1.6],[.95,1.2]]},
  A:{x:0, z:5, face:0}
},
{
  id:'truck', name:'Truck / tracking', abbr:'TRUCK', cat:'Movement', dur:7,
  tags:{mood:['energetic','reflective'], use:['action','performance'], gear:['dolly/slider','gimbal'], level:'intermediate'},
  summary:'The camera travels sideways alongside the subject. Parallax brings depth to life.',
  lede:'A truck (or lateral tracking shot) moves the camera sideways, usually alongside a moving subject. Because the camera travels, foreground objects rush past while the background crawls. This parallax is what makes tracking shots feel so three-dimensional.',
  how:['Match the subject\'s speed exactly so they hold their place in the frame.','Put something in the foreground (posts, trees, railings) to show off the parallax.','Use a dolly on track, a car, or a gimbal operator walking sideways.'],
  reads:['Momentum','Journey','Depth'],
  implies:'Journey and momentum. Tracking with someone makes the audience travel with them, a companion rather than an observer. It is the classic "walk and sing" music-video shot.',
  use:['Walk-and-sing performance','Characters on a journey, literal or emotional','Revealing a space as you move through it'],
  avoid:['Nothing in the foreground: the move loses its depth and looks like a pan','Speed mismatch that lets the subject drift out of frame'],
  practice:'Walk a gimbal sideways past a row of railings while a friend walks alongside. Then shoot the same walk as a pan from one spot and compare the depth.',
  quiz:{q:'Why add foreground objects to a tracking shot?', opts:['They show parallax, which gives a strong sense of depth','They hide the dolly track','They make the shot brighter'], a:0, why:'Near objects move faster than far ones when the camera travels.'},
  pairs:['pan','steadicam','doubledolly'],
  refs:[['The Verve, "Bitter Sweet Symphony" (1997)','one continuous take following the singer along a pavement'],['Jean-Luc Godard\'s Week End (1967)','the long lateral traffic-jam track']],
  beats:[[0,'The camera moves sideways at walking pace, level with the subject.'],[.3,'The near post rushes past the lens.'],[.55,'Far buildings barely move. This speed difference is parallax.'],[.85,'The subject holds their place in frame. We are travelling with them.']],
  cam:{y:1.55, z:1.6, f:32, yaw:6, tilt:-2},
  A:{x:[[0,-3],[1,3,'l']], z:5, face:-90},
  props:{post:{x:-.3, z:2.9}},
  fn(t,S){ S.cam.x = S.A.x - .3; S.A.walk = t*42; }
},
{

  summary:'The camera rises vertically, lifting the audience above the scene.',
  lede:'A crane shot moves the camera vertically through space, rising up and away from (or descending towards) the subject. Where a tilt only rotates, a crane physically lifts the lens, so the view over walls and crowds opens up.',

  avoid:['Wobbly booms (settle the arm at the end)','Craning without a reveal or emotional lift'],
  practice:'Hold a gimbal low at knee height and rise to above your head while tilting down onto a subject. Time it to a chorus.',
  quiz:{q:'What separates a crane-up from a tilt-up?', opts:['The camera physically rises through space','A crane uses a zoom lens','A tilt is always slower'], a:0, why:'A crane changes the camera\'s height, so the view and perspective change. A tilt only rotates.'},
  pairs:['drone','tilt','pullout'],
  refs:[['Touch of Evil (1958)','the famous opening crane long take'],['Stadium music videos','rising over the crowd on the chorus']],
  beats:[[0,'The camera is low, near the subject\'s chest height.'],[.3,'The arm lifts the camera straight up while tilting down to hold the subject.'],[.6,'The horizon climbs. We see over the scene to the skyline behind.'],[.9,'From high above, the subject is part of a bigger world.']],
  cam:{z:[[0,2],[1,-1]], y:[[0,.9],[.12,.9],[.95,7,'c'],[1,7]], f:28, aim:'A', aimY:1.3},
  A:{x:0, z:5, face:0, arms:[[0,0]]},
  guides:{horizon:true}

{
  id:'arc', name:'Arc / orbit', abbr:'ARC', cat:'Movement', dur:9,
  tags:{mood:['epic','powerful','dreamy','energetic'], use:['performance','emotion','reveal'], gear:['gimbal','dolly/slider'], level:'advanced'},
  summary:'The camera circles the subject. The world spins, the subject stays centred.',
  lede:'An arc (or orbit) moves the camera in a circle around the subject while keeping them centred. The background sweeps behind them, making the subject feel like the still centre of a turning world. Take it all the way round and you get the famous 360° "hero shot".',
  how:['Keep the distance to the subject constant as you circle. Walk heel-to-toe with a gimbal or use circular track.','Keep the subject centred and in focus throughout.','Have a textured background (lights, crowd) so the movement reads.','For a 360°, hide or move crew and lights. Everything is in shot.'],
  reads:['Heroism','Reverie','Importance'],
  implies:'Centrality. The world revolves around this person, whether that is heroism, romance, a moment of revelation or vertigo. In music videos it turns a performer into the axis of the whole world.',
  use:['A hero or artist "moment" at the song\'s peak','Two lovers in a spinning kiss','A character overwhelmed, with the world spinning around them'],
  avoid:['Losing focus or drifting distance mid-orbit','Using it without a reason, which makes it a gimmick'],
  practice:'Circle a friend with a phone on a gimbal at arm\'s length, keeping their eyes in the centre. Try it at walking pace and very slowly. Which feels romantic, which feels heroic?',
  quiz:{q:'What stays constant during a clean orbit?', opts:['The distance to the subject and their position in frame','The background','The camera\'s direction'], a:0, why:'The subject stays centred at a fixed distance while everything behind them sweeps past.'},
  pairs:['steadicam','low','dollyzoom'],
  refs:[['Bad Boys II (2003)','Michael Bay\'s spinning low-angle hero orbits'],['Brian De Palma\'s films','romantic 360° orbits']],
  beats:[[0,'The camera sits in front of the subject, facing them.'],[.25,'It begins circling, always aimed at the subject\'s centre.'],[.5,'Halfway round, we see their back and the camera\'s side of the set.'],[.85,'Behind them, the whole world has swept by. They are the still point.']],
  cam:{f:32, y:1.5},
  A:{x:0, z:5, face:0},
  fn(t,S){ const a = t*2*Math.PI, R = 2.6; S.cam.x = S.A.x - Math.sin(a)*R; S.cam.z = S.A.z - Math.cos(a)*R; S.cam.yaw = a/Engine.D2R; S.cam.tilt = -1; }
},
{

  summary:'A smooth, floating camera follows the subject through space.',

  how:['Use a Steadicam or 3-axis gimbal. Walk with soft knees ("ninja walk").','Keep a steady distance: close enough for intimacy, far enough for a safety buffer.','Plan the route, blocking and reveals. Long takes are choreography.'],

  use:['Walking into a venue behind the artist','One-take music videos','Leading into a reveal as the subject turns a corner'],
  avoid:['Uneven distance, which makes the subject bounce around the frame','Long takes with no evolving action'],

{
  id:'snorricam', name:'Snorricam', abbr:'BODY RIG', cat:'Movement', dur:7,
  tags:{mood:['uneasy','energetic','dreamy'], use:['emotion','performance'], gear:['body rig'], level:'advanced'},
  summary:'Camera rigged to the actor. Their face stays locked while the world lurches.',
  lede:'A Snorricam rigs the camera to the actor\'s body, pointing back at their face. As they move, their face stays fixed in frame while the world behind them swings, lurches and bobs. It is disorienting, subjective and unmistakable.',
  how:['Use a body rig or harness that mounts the camera to the actor\'s chest or waist.','A wide lens (14–24mm) keeps the face and background in view.','The actor must perform the movement: stumble, run, dance.','Safety first: rigs are heavy and change the actor\'s balance.'],
  reads:['Disorientation','Intoxication','Panic'],
  implies:'Subjective chaos. The face is stable but the world isn\'t, which is exactly how being drunk, high or in panic feels. It locks the audience to the character\'s body.',
  use:['Intoxication or panic','A performer dancing through a crowd','A character walking in a daze'],
  avoid:['Calm, grounded moments','Long durations, which make audiences queasy'],
  practice:'Hold a phone at arm\'s length facing yourself (a low-budget Snorricam) and walk, stumble and spin. Watch how the background does all the work.',
  quiz:{q:'In a Snorricam shot, what stays fixed in frame?', opts:['The actor\'s face','The horizon','The background'], a:0, why:'The camera moves with the body, so the face is locked while the world moves.'},
  pairs:['handheld','doubledolly','pov'],
  refs:[['Mean Streets (1973)','Harvey Keitel\'s drunken bar scene'],['Requiem for a Dream (2000)','Marion\'s panicked walk']],
  beats:[[0,'The camera is rigged to the actor, pointing back at their face.'],[.3,'They stagger forward. Their face stays locked in frame.'],[.55,'The world behind them lurches and rolls.'],[.85,'Stable face, unstable world. That is how being drunk or panicked feels.']],
  cam:{y:1.55, f:20},
  A:{z:[[0,12],[1,6,'l']], face:0},
  fn(t,S){ const T = t*Math.PI*2; S.A.x = Math.sin(T*1.5)*.45; S.A.walk = t*40; S.cam.x = S.A.x; S.cam.z = S.A.z - .85; S.cam.y = 1.55 + Math.sin(T*6)*.03; S.cam.yaw = Math.sin(T*1.5+.4)*6; S.cam.roll = Math.sin(T*1.5)*10; const dy = 1.6 - S.cam.y; S.cam.tilt = Math.atan2(dy, .85)/Engine.D2R; S.cam.focus = .85; }
},
{

  avoid:['Accidental walking motion from the actor','Using it where natural movement would suit'],
  practice:'Film a friend standing on a skateboard pushed gently while you walk backwards in step with a gimbal. Keep their body completely still.',
  quiz:{q:'What gives the double dolly its floating feel?', opts:['The actor moves through space without walking','A slow zoom','Shallow focus'], a:0, why:'Gliding with no step motion reads as uncanny, as if they are being carried.'},

{

{
  id:'speedramp', name:'Speed ramp', abbr:'RAMP', cat:'Movement', dur:7,
  tags:{mood:['energetic','epic','powerful'], use:['action','performance'], gear:['gimbal','fast lens'], level:'advanced'},
  summary:'Real-time snaps into slow motion and back again. Time bends on the key moment.',
  lede:'A speed ramp changes the playback speed within a single shot: real-time, then slow motion on the key moment, then snapping back. It needs a high frame rate when shooting (60–240fps) so the slow part is smooth.',
  how:['Shoot at a high frame rate (120fps or more) with enough light for the fast shutter.','Plan the peak moment (a jump, hair flip or drop) and ramp around it.','Ramp in post: speed up the approach, slow the peak, speed out.','Cut the ramp to the music. Ramp down on the beat drop.'],
  reads:['Impact','Style','Suspension'],
  implies:'Heightened time. Speeding up then slowing down tells the audience "feel this moment." It is stylised and a little bit comic-book, suited to action and high-energy performance.',
  use:['Beat drops and hits','Jumps, hair flips, action peaks','Dance moves you want to savour'],
  avoid:['Ramping on moments with no peak','Shooting at normal frame rates, which gives choppy slow motion'],
  practice:'Film a friend jumping at 120fps, then in your editor ramp from 200% to 20% at the apex and back to 200%.',
  quiz:{q:'Why shoot at a high frame rate for a speed ramp?', opts:['So the slow-motion section stays smooth','To make the file smaller','To avoid needing lights'], a:0, why:'Slow motion spreads the frames out. You need extra frames to keep it fluid.'},
  pairs:['ecu','arc','crash'],
  refs:[['300 (2006)','Zack Snyder\'s ramped battle sequences'],['Action-sports edits','ramping around jumps and tricks']],
  beats:[[0,'Real-time: the camera trucks fast as the subject crouches.'],[.35,'The jump starts and time slows right down.'],[.5,'Floating at the apex at about 15% speed. The audience can savour it.'],[.7,'Snapping back to real time for the landing.']],
  cam:{y:1.2, f:28},
  A:{x:0, z:5, face:-20},
  speedOf(t){ return Math.max(.12, 1 + .88*Math.cos(2*Math.PI*t)); },
  fn(t,S){ const u = t + (.88/(2*Math.PI))*Math.sin(2*Math.PI*t); const j = Math.max(0, Math.sin(Math.min(1,Math.max(0,(u-.3)/.4))*Math.PI)); S.A.y = j*1.1; S.A.arms = j>.3?'up':0; const a = -.9 + u*1.8, R=3; S.cam.x = S.A.x - Math.sin(a)*R; S.cam.z = S.A.z - Math.cos(a)*R; const dy = 1.4 + S.A.y*.8 - S.cam.y; S.cam.yaw = a/Engine.D2R; S.cam.tilt = Math.atan2(dy,R)/Engine.D2R; }
},
{

  how:['Use a shallow depth of field (fast lens, wide aperture, longer focal length).','Mark the two focus distances on the lens or follow-focus.','Time the pull to motivation: a line, a look, a sound.','Pull at a speed that suits the mood. Snap for surprise, drift for reflection.'],

  implies:'"Now look here." A rack connects two things, a speaker and a listener, a person and what they fear, and tells the audience which matters now. It can reveal something that was in frame all along.',

  avoid:['Deep depth of field, where the rack barely shows','Racking with no motivation'],
  practice:'Place a friend 1m from the lens and another 4m away. Rack between them at f/1.8 as each speaks a line.',

{

  summary:'A long lens from far away stacks the background right behind the subject.',
  lede:'Shoot on a long lens (135–400mm) from far away and depth appears to flatten: the background looms right behind the subject, objects seem stacked together, and distances shrink. This is telephoto compression. The flattening comes from the camera\'s distance, and the long lens is what lets you keep the subject large from out there.',
  how:['Step far back and use a long lens to keep the subject the same size.','Line up background elements (buildings, lights, crowds) behind the subject.','Use a solid tripod. Long lenses magnify every shake.'],

  avoid:['Moments where you need space and air around the subject','Handheld on long lenses'],
  practice:'Photograph a friend in front of distant buildings on 24mm up close, then on 200mm from far away with them the same size in frame.',
  quiz:{q:'What actually causes the compression effect?', opts:['Camera distance from the subject (a long lens lets you keep them large from far away)','The telephoto lens glass itself','Shallow depth of field'], a:0, why:'Perspective depends on distance. The lens just crops it.'},

{

  refs:[['The Grand Budapest Hotel (2014)','Wes Anderson\'s centred tableaux'],['The Shining (1980)','Kubrick\'s symmetrical corridors']],
  beats:[[0,'The camera sits exactly on the centre line of the street.'],[.3,'Lamp posts and path lines mirror each other perfectly.'],[.6,'The subject stands on the vanishing point. Every line leads to them.'],[.85,'A slow, centred push reinforces the control.']],

const GLOSSARY = {
  'parallax': 'When the camera moves, near objects slide across the frame faster than far ones. It is the giveaway that a camera travelled rather than zoomed.',
  'depth of field': 'The slice of distance that is in sharp focus. Shallow means only a thin slice is sharp; deep means nearly everything is.',
  'bokeh': 'The soft, glowing look of out-of-focus highlights, such as street lamps behind a subject shot at a wide aperture.',
  'aperture': 'The opening in the lens, written as an f-number. Low numbers (f/1.4) let in more light and blur the background; high numbers (f/16) keep more in focus.',
  'focal length': 'The lens size in millimetres. Short (14–24mm) sees wide and exaggerates depth; long (85mm+) sees narrow and flattens depth.',
  'wide lens': 'A short focal length (roughly 14–35mm). Fits more in, stretches space and exaggerates anything close to the lens.',
  'telephoto': 'A long focal length (roughly 85mm and up). Magnifies distant subjects and makes the background feel close behind them.',
  'headroom': 'The gap between the top of the head and the top of the frame. Too much looks empty; too little looks cramped. In close-ups, none is fine.',
  'look room': 'Empty space in front of the direction the subject faces or moves. Without it the frame feels like the subject is hitting a wall.',
  'lead room': 'Look room for a moving subject: leave space in front of them to walk into.',
  'rule of thirds': 'Divide the frame into a 3×3 grid and put important things on the lines or crossings, not dead centre. A default that symmetry breaks on purpose.',
  '180° rule': 'Draw an imaginary line between two characters. Keep every camera on one side of it so each person stays on their own side of the screen.',
  'eyeline': 'The direction a character looks. Matching eyelines between shots convinces the audience two people are looking at each other.',
  'shot/reverse shot': 'Cutting between a shot of one character and the matching shot of the other. The standard way to cover a conversation.',
  'coverage': 'All the different shots of one scene (wide, mediums, close-ups) so the editor has choices.',
  'master shot': 'One wide shot that covers the whole scene from start to finish. The safety net you cut back to.',
  'locked off': 'The camera does not move at all, usually on a tripod.',
  'handheld': 'The camera is held by the operator with no stabiliser, so the frame moves with their body.',
  'gimbal': 'A motorised stabiliser that keeps the camera level and smooth while the operator walks.',
  'dolly': 'A wheeled platform (often on track) that moves the whole camera smoothly through space.',
  'slider': 'A short rail the camera glides along. A small dolly for short moves.',
  'jib': 'A counterweighted arm that lifts the camera up and down through the air. A small crane.',
  'pedestal': 'Raising or lowering the whole camera straight up or down without tilting.',
  'roll': 'Rotating the camera around the lens axis so the horizon tips. A Dutch angle is a held roll.',
  'tilt': 'Pivoting the camera up or down on a fixed point.',
  'pan': 'Pivoting the camera left or right on a fixed point.',
  'motion blur': 'Streaking that appears when something moves during the time the shutter is open. Fast whips and crash zooms rely on it.',
  'shutter angle': 'How long each frame is exposed, written as degrees. 180° is the normal, natural amount of motion blur.',
  'frame rate': 'Frames captured per second. 24fps is the cinema look; shoot 60–240fps if you want smooth slow motion later.',
  'rack focus': 'Shifting the focus from one distance to another during a shot so attention moves with it.',
  'focus pull': 'Another name for a rack focus, or for keeping focus on a moving subject.',
  'ND filter': 'A neutral grey filter that cuts light without changing colour, so you can keep a wide aperture in bright daylight.',
  'blocking': 'Planning where the actors and camera move during a shot, usually rehearsed before rolling.',
  'lip-sync': 'A performer miming to the recorded song on set so the video cuts to the track.',
  'insert': 'A close shot of a detail (an object, a hand) cut into a scene to give information.',
  'establishing shot': 'A wide shot at the start of a scene that tells the audience where they are.',
  'tableau': 'A carefully composed, often symmetrical frame where the action plays out like a staged picture.',
  'compression': 'The flattened look of a long lens used from far away: the background seems stacked right behind the subject.',
  'vertigo effect': 'Another name for the dolly zoom: dolly and zoom in opposite directions so the background warps while the subject holds size.',
  'parfocal': 'A zoom lens that keeps focus as you zoom. Cheaper zooms drift focus and need refocusing at the new focal length.',
  'safe area': 'The inner margin of the frame that will stay visible on every screen and behind any captions. Keep titles and faces inside it.',
};

  summary: 'Key at about 35°, slightly above. A small nose shadow that "loops" onto the cheek.', lede: 'Loop lighting puts the key about 35–45° off the camera axis and a little above eye height. The nose throws a short shadow that curls down towards the corner of the mouth without touching the cheek shadow. It flatters almost everyone and is the default portrait light.',

  reads: ['Flattering', 'Natural', 'Everyday'], implies: 'Normal, approachable, well-made. Loop is how most faces look best, so it says "this person is fine to look at" without commenting further.',
  use: ['Interviews and to-camera pieces', 'Lip-sync where the artist should look good', 'The default when you have no reason to choose anything else'], avoid: ['Moments that need drama or menace'],
  practice: 'Light a friend in loop, then raise the key 20cm at a time. Watch the nose shadow lengthen until it meets the cheek shadow. That meeting point is the next lesson.',
  quiz: { q: 'What defines loop lighting?', opts: ['A short nose shadow that does not connect to the cheek shadow', 'A triangle of light on the cheek', 'A shadow directly under the nose'], a: 0, why: 'The loop is the little curl of nose shadow towards the mouth corner.' },
  pairs: ['l-rembrandt', 'l-butterfly', 'l-flat'], refs: [['Most magazine portraits', 'loop is the industry default'], ['Studio interviews', 'loop key plus soft fill']],
  beats: [[0, 'Key at 40°, a little above the eyes.'], [.3, 'The nose shadow curls towards the mouth corner and stops.'], [.6, 'The bounce card lifts the far cheek so it does not fall away.'], [.85, 'Flattering, natural, the default.']],
  lights: [KEY({ angle: 40, elev: 28, dist: 1.6 }), FILL({ power: [[0, 0], [.55, 0], [.7, .35]] })],
  notes: [{ k: 'ring', t: [.25, .55], x: .028, y: 1.575, rx: .025, ry: .04, text: 'the loop', col: 'or' }, { k: 'text', t: [.6, .85], text: 'Bounce card lifts the shadow side' }] },
{ id: 'l-rembrandt', name: 'Rembrandt light', abbr: 'REMB', cat: 'Portrait patterns', dur: 7, kind: 'light',
  tags: { mood: ['dramatic', 'intimate', 'reflective'], use: ['performance', 'dialogue', 'emotion'], gear: ['one LED', 'softbox'], level: 'beginner' },
  summary: 'Key at 45° and high. The nose shadow meets the cheek shadow, leaving a triangle of light under the far eye.', lede: 'Rembrandt lighting comes from the painter\'s portraits: a single key placed high and about 45° to the side, so the nose shadow joins the cheek shadow and leaves a small triangle of light on the far cheek, just below the eye. One light, a lot of drama.',
  how: ['Key at 45° and raised so it angles down at about 45°.', 'Move it until the nose shadow just touches the cheek shadow and closes the triangle.', 'The triangle should be no wider than the eye and no longer than the nose.', 'Little or no fill. The dark side is the point.'],
  reads: ['Drama', 'Depth', 'Thought'], implies: 'Seriousness and interiority. Half the face is in shadow, so the subject seems to be thinking, hiding or carrying something. It is the classic "moody performance" light.',
  use: ['Moody lip-sync and performance', 'Emotional verses', 'Any face that should look like it has a story'], avoid: ['Comedy or lightness', 'Round faces where the shadow side can look heavy (raise the fill)'],
  practice: 'One light, no fill. Find the triangle, then slide the key 10° at a time either way and watch it open (loop) or close (split).',
  quiz: { q: 'What is the giveaway of Rembrandt light?', opts: ['A triangle of light on the shadow-side cheek', 'A shadow under the nose like a butterfly', 'Light from behind the head'], a: 0, why: 'The nose and cheek shadows join around a small triangle under the far eye.' },
  pairs: ['l-loop', 'l-split', 'l-lowkey'], refs: [['Rembrandt\'s self-portraits', 'where the name comes from'], ['The Godfather (1972)', 'Gordon Willis\'s top-heavy Rembrandt keys']],
  beats: [[0, 'Start in loop: the nose shadow is short.'], [.25, 'The key rises and swings wider.'], [.5, 'The nose shadow reaches the cheek shadow and joins it.'], [.75, 'A triangle of light survives under the far eye. That is Rembrandt.']],
  lights: [KEY({ angle: [[0, 38], [.2, 38], [.55, 52]], elev: [[0, 26], [.2, 26], [.55, 42]], dist: 1.5, size: .7 })],
  notes: [{ k: 'ring', t: [.6, 1], x: .05, y: 1.585, rx: .022, ry: .035, text: 'the triangle', col: 'or' }, { k: 'text', t: [.05, .3], text: 'Loop: short nose shadow' }] },
{ id: 'l-butterfly', name: 'Butterfly light', abbr: 'BTFLY', cat: 'Portrait patterns', dur: 6, kind: 'light',
  tags: { mood: ['glamorous', 'neutral'], use: ['beauty', 'performance', 'social'], gear: ['one LED', 'softbox', 'bounce card'], level: 'beginner' },
  summary: 'Key directly in front and high. A small butterfly-shaped shadow under the nose.', lede: 'Butterfly (or Paramount) light sits straight in front of the face and high, angled down. It throws a symmetrical shadow under the nose shaped like a butterfly, sculpts the cheekbones, and was the glamour light of 1930s Hollywood.',
  how: ['Key directly above the camera, raised so it angles down at 30–45°.', 'Look for the small shadow under the nose and shadows under the cheekbones.', 'A bounce card at chest height, angled up, fills under the chin and eyes. Classic beauty "clamshell".'],
  reads: ['Glamour', 'Symmetry', 'Polish'], implies: 'Beauty and presentation. Butterfly is symmetrical and sculpting, so the face looks composed and presented rather than caught. Great for the artist as icon, not the artist as human.',
  use: ['Beauty and glamour shots', 'Symmetrical, iconic performance framings', 'Cheekbones you want to show off'], avoid: ['Round faces (it shortens them)', 'Naturalistic, caught-in-the-moment scenes'],
  practice: 'Key above the lens, then add a white card below the face angled up. Compare with and without: the card is the difference between sculpted and raccoon eyes.',
  quiz: { q: 'Where does the butterfly key sit?', opts: ['Directly in front of the face and high', '90° to the side', 'Behind the subject'], a: 0, why: 'On the camera axis, above, angled down: the shadow lands under the nose.' },
  pairs: ['l-loop', 'l-flat', 'l-toplight'], refs: [['1930s Paramount stills', 'the Marlene Dietrich look'], ['Beauty campaigns', 'clamshell butterfly with a reflector']],
  beats: [[0, 'Key straight in front, high, angled down.'], [.3, 'A symmetrical shadow under the nose: the butterfly.'], [.55, 'Cheekbones sculpt. Eye sockets deepen.'], [.8, 'A bounce card below lifts the eyes and chin: the clamshell.']],
  lights: [KEY({ angle: 0, elev: 40, dist: 1.5, size: .9 }), FILL({ name: 'Card below', angle: 0, elev: -25, dist: 1.0, power: [[0, 0], [.75, 0], [.9, .4]] })],
  notes: [{ k: 'ring', t: [.25, .6], x: 0, y: 1.555, rx: .03, ry: .025, text: 'the butterfly', col: 'or' }, { k: 'text', t: [.78, 1], text: 'Card below fills the eye sockets' }] },
{ id: 'l-split', name: 'Split light', abbr: 'SPLIT', cat: 'Portrait patterns', dur: 6, kind: 'light',
  tags: { mood: ['dramatic', 'tense', 'uneasy'], use: ['emotion', 'performance', 'reveal'], gear: ['one LED'], level: 'beginner' },
  summary: 'Key at 90°. Half the face lit, half in darkness.', lede: 'Split lighting puts the key at 90° to the camera axis, at eye height. One half of the face is lit and the other falls into shadow, divided down the nose. It is the most dramatic single-light pattern and reads as conflict or duality.',
  how: ['Key directly to the side at eye height.', 'Use a smaller, harder source for a crisper line down the face.', 'No fill, or only a hint, so the dark side stays dark.', 'A catchlight in the shadow-side eye stops it dying: turn the head a touch towards the key.'],
  reads: ['Duality', 'Conflict', 'Menace'], implies: 'Two sides. A character torn, hiding something, or dangerous. Used on a performer it turns a lyric into a confession.',
  use: ['Villains and inner conflict', 'Dark, minimal performance', 'Two-faced lyrics'], avoid: ['Beauty and warmth', 'Anyone who should look trustworthy'],
  practice: 'Side light at eye height, hard. Ask the subject to turn their head slowly towards and away from the light and watch the split move across the face.',
  quiz: { q: 'What does split light imply?', opts: ['Duality or hidden sides', 'Glamour', 'Neutral normality'], a: 0, why: 'Half lit, half dark: the face literally has two sides.' },
  pairs: ['l-rembrandt', 'l-lowkey', 'l-hardsoft'], refs: [['Film noir', 'split faces in venetian blind light'], ['The Dark Knight (2008)', 'Two-Face lit as the name']],
  beats: [[0, 'Key swings out to 90°, at eye height.'], [.35, 'The face divides down the nose: one half lit, one half dark.'], [.6, 'A hard source keeps the line crisp.'], [.85, 'A tiny head turn puts a catchlight in the dark eye.']],
  lights: [KEY({ angle: [[0, 45], [.35, 90]], elev: 8, dist: 1.5, size: [[0, .7], [.5, .7], [.65, .2]] })],
  notes: [{ k: 'text', t: [.35, .6], text: 'Divided down the nose' }, { k: 'text', t: [.62, .85], text: 'Smaller source: crisper line', col: 'or' }] },
{ id: 'l-broad', name: 'Broad vs short', abbr: 'B/S', cat: 'Portrait patterns', dur: 8, kind: 'light',
  tags: { mood: ['neutral', 'dramatic'], use: ['interview', 'dialogue'], gear: ['one LED', 'softbox'], level: 'intermediate' },
  summary: 'Same light, head turned. Lighting the near cheek widens the face; lighting the far cheek slims it.', lede: 'Broad and short describe which side of a turned face the key lands on. Broad lights the cheek nearest the camera, which widens the face. Short lights the far cheek, so the near side falls into shadow and the face slims and gains depth. Nothing moves but the head.',
  how: ['Turn the subject\'s head about 30° away from the camera.', 'Broad: key on the same side as the visible (near) cheek.', 'Short: key on the far side, so the shadow falls on the near cheek.', 'Short is almost always the more flattering and more cinematic choice.'],
  reads: ['Wide vs slim', 'Flat vs deep'], implies: 'Broad feels open and plain. Short feels sculpted and dimensional. Most cinematographers default to short light because the shadow side faces the camera and gives the face depth.',
  use: ['Short: almost every interview and performance', 'Broad: to widen a narrow face, or for a deliberately plain look'], avoid: ['Broad on round faces'],
  practice: 'Keep the key where it is. Have the subject turn their head left, then right. One direction is broad, the other short. Film both and pick.',
  quiz: { q: 'Which is usually more flattering?', opts: ['Short light: shadow on the near cheek', 'Broad light: light on the near cheek', 'They are identical'], a: 0, why: 'The shadow side faces the camera, which slims the face and adds depth.' },
  pairs: ['l-loop', 'l-rembrandt', 'l-window'], refs: [['Classic Hollywood portraiture', 'short light almost without exception']],
  beats: [[0, 'Head turned 30°. Key lights the near cheek: broad.'], [.3, 'The face reads wide and flat.'], [.5, 'Same key. The head turns the other way: short.'], [.8, 'Shadow falls on the near cheek. Slimmer, deeper, more cinematic.']],
  lights: [KEY({ angle: 45, elev: 28, dist: 1.6 })], env: { wallDist: 1.6 }, headYaw: [[0, 28], [.42, 28], [.55, -28]],
  notes: [{ k: 'text', t: [.05, .45], text: 'BROAD: lit cheek nearest camera' }, { k: 'text', t: [.52, 1], text: 'SHORT: shadow side nearest camera', col: 'or' }] },
{ id: 'l-hardsoft', name: 'Hard vs soft', abbr: 'H/S', cat: 'Quality', dur: 8, kind: 'light',
  tags: { mood: ['dramatic', 'intimate'], use: ['performance', 'beauty', 'emotion'], gear: ['one LED', 'softbox'], level: 'beginner' },
  summary: 'The same light, bare then through a softbox. Size and distance decide the edge of every shadow.', lede: 'Hard light comes from a small source: sharp shadow edges, bright highlights, every pore visible. Soft light comes from a big source: shadows that fade gently, skin that smooths. The only things that change softness are the size of the source and how close it is.',
  how: ['Bare LED at 2m: hard. Note the crisp nose shadow and the hot highlight.', 'Add the softbox: the source is now 60–90cm across. Shadows soften.', 'Move it closer: it gets bigger relative to the face, so softer still.', 'Diffusion further from the light (a sheet, a bounce off a wall) makes it softer again.'],
  reads: ['Hard: edge, grit', 'Soft: warmth, beauty'], implies: 'Hard light says harsh, honest, dangerous, noon sun. Soft light says gentle, flattering, overcast, intimate. Choosing between them is the first mood decision on any shoot.',
  use: ['Hard: gritty rap performance, noir, sweat and texture', 'Soft: beauty, intimacy, most dialogue'], avoid: ['Hard light on skin you want to flatter', 'Soft light when you need punch and contrast'],
  practice: 'Bare light, then softbox, then softbox at half the distance, then bounced off a white wall. Four shots, same face. Line them up.',
  quiz: { q: 'What makes a light softer?', opts: ['A bigger source, closer to the subject', 'More power', 'A cooler colour temperature'], a: 0, why: 'Softness is the apparent size of the source from the subject\'s point of view.' },
  pairs: ['l-split', 'l-window', 'l-loop'], refs: [['Noon sun vs overcast sky', 'nature\'s hard and soft'], ['Beauty ads', 'enormous soft sources']],
  beats: [[0, 'Bare LED at 2m: a small, hard source.'], [.25, 'Crisp shadow edge under the nose, hot highlight on the forehead.'], [.5, 'Softbox on: the source is now a big rectangle.'], [.75, 'Closer still. Shadows fade gently. Skin smooths.']],
  lights: [KEY({ angle: 45, elev: 30, dist: [[0, 2], [.65, 2], [.9, 1.1]], size: [[0, .08], [.45, .08], [.55, .9]] })],
  notes: [{ k: 'ring', t: [.2, .45], x: .03, y: 1.565, rx: .025, ry: .03, text: 'hard edge', col: 'or' }, { k: 'text', t: [.5, .75], text: 'Softbox: big source, soft edge' }, { k: 'text', t: [.78, 1], text: 'Closer = bigger = softer' }] },
{ id: 'l-threepoint', name: 'Three-point light', abbr: '3PT', cat: 'Three-point', dur: 9, kind: 'light',
  tags: { mood: ['neutral', 'polished'], use: ['interview', 'performance', 'dialogue'], gear: ['one LED', 'softbox', 'bounce card', 'second light'], level: 'beginner' },
  summary: 'Key, fill and back light, added one at a time. The textbook setup, and why each light exists.', lede: 'Three-point lighting builds a face in layers: a key to shape it, a fill to control how dark the shadows go, and a back light to separate the head from the background. Watch each one arrive and you understand what every other setup is doing.',
  how: ['Key first: softbox at 45°, above. Shape the face.', 'Fill second: a bounce card opposite the key, or a second light at low power. Decide how dark the shadow side should be.', 'Back light third: a small light behind and above, opposite the key, to put a rim of light on the hair and shoulder.', 'With a small kit: key = your LED, fill = a white card, back light = a practical or your second light.'],
  reads: ['Polish', 'Separation', 'Control'], implies: 'Professional and controlled. Three-point is the look of broadcast interviews and studio performance. Deliberately clean rather than moody.',
  use: ['Interviews', 'Studio-style performance on a plain background', 'Learning: it teaches what each light is for'], avoid: ['Naturalistic scenes where three sources would look staged'],
  practice: 'Build it one light at a time and film each stage. Then kill the fill and see how much drama comes back.',
  quiz: { q: 'What does the back light do?', opts: ['Separates the subject from the background with a rim', 'Lightens the shadow side of the face', 'Shapes the nose shadow'], a: 0, why: 'A rim on the hair and shoulders makes the subject pop off the background.' },
  pairs: ['l-rim', 'l-loop', 'l-lowkey'], refs: [['Any broadcast interview', 'three-point, sometimes with a fourth on the background']],
  beats: [[0, 'Key only: shape, but the shadow side is black and the head merges into the wall.'], [.3, 'Fill arrives: a bounce card opposite. The shadows open up.'], [.6, 'Back light arrives: a rim on the hair and shoulder. The head separates from the background.'], [.85, 'Three layers. Now you can dial any of them.']],
  lights: [KEY({ angle: 45, elev: 30, dist: 1.6 }), FILL({ power: [[0, 0], [.28, 0], [.4, .35]] }), RIM({ power: [[0, 0], [.58, 0], [.7, .9]] })],
  notes: [{ k: 'text', t: [.05, .28], text: 'Key only' }, { k: 'text', t: [.32, .58], text: 'Key + fill' }, { k: 'ring', t: [.65, 1], x: -.07, y: 1.66, rx: .03, ry: .06, text: 'rim: separation', col: 'or' }] },
{ id: 'l-rim', name: 'Back light / rim', abbr: 'RIM', cat: 'Three-point', dur: 7, kind: 'light',
  tags: { mood: ['dramatic', 'epic', 'dreamy'], use: ['performance', 'reveal', 'emotion'], gear: ['one LED', 'practical'], level: 'beginner' },
  summary: 'A light behind the subject, aimed at the camera. An edge of light around head and shoulders.', lede: 'A back light (rim, kicker, hair light) sits behind the subject, above, pointing back towards the camera. It draws a bright edge around the hair and shoulders. On its own it makes a silhouette with a halo; with a key it separates the subject from the background.',
  how: ['Put the light behind and above the subject, opposite the key, out of frame.', 'Flag it or angle it so it does not flare into the lens.', 'Hard sources make a crisp edge; soft ones a glow.', 'Add haze and the beam itself becomes visible.'],
  reads: ['Separation', 'Halo', 'Drama'], implies: 'Importance and depth. A rim makes the subject pop from the background and adds a halo of significance. Alone, with haze, it is the classic concert and hip-hop silhouette.',
  use: ['Separating dark hair from a dark background', 'Silhouette performance with haze', 'Adding a "premium" edge to any close-up'], avoid: ['Flaring straight into the lens by accident'],
  practice: 'Kill the key. Rim only, with the subject turning slowly. Then bring the key up to 20% and see how little you need.',
  quiz: { q: 'Where does a rim light sit?', opts: ['Behind and above the subject, aimed towards the camera', 'Beside the camera', 'Below the face'], a: 0, why: 'Light from behind catches the edges of hair and shoulders.' },
  pairs: ['l-threepoint', 'l-silhouette', 'l-haze'], refs: [['Concert lighting', 'back lights through haze'], ['Blade Runner 2049 (2017)', 'rims and silhouettes throughout']],
  beats: [[0, 'Rim only, no key. A silhouette with a bright edge.'], [.3, 'The light behind traces hair and shoulders.'], [.55, 'Key comes up low: the face returns, the rim still separates it.'], [.8, 'Haze in the air and the beam itself appears.']],
  lights: [RIM({ angle: 145, elev: 40, dist: 1.6, power: 1.1 }), KEY({ power: [[0, 0], [.5, 0], [.62, .45]], angle: -40, elev: 25 })], env: { haze: [[0, 0], [.75, 0], [.9, .6]], wallDist: 2.2, ambient: .02 },
  notes: [{ k: 'text', t: [.05, .5], text: 'Rim only: silhouette with an edge' }, { k: 'text', t: [.78, 1], text: 'Haze makes the beam visible', col: 'or' }] },
{ id: 'l-window', name: 'Window key', abbr: 'WINDOW', cat: 'Motivated', dur: 7, kind: 'light',
  tags: { mood: ['intimate', 'reflective', 'natural'], use: ['dialogue', 'performance', 'interview'], gear: ['window', 'bounce card'], level: 'beginner' },
  summary: 'A window as a huge soft key. Free, beautiful, and the first light to learn.', lede: 'A north-facing window, or any window out of direct sun, is a giant soft source. Put the subject beside it at 45–90° and you have a Rembrandt or split key that cost nothing. A white card on the other side controls the ratio. Most "natural" cinematic interiors are exactly this.',
  how: ['Subject beside the window, turned so the light hits at 45–90°.', 'Camera between window and subject, looking along the wall, so the window is off-frame.', 'White card or wall on the shadow side for fill. Black card to deepen it.', 'Daylight is 5600–6500K, so set white balance to daylight or the practicals will look orange (which can be a choice).'],
  reads: ['Natural', 'Honest', 'Quiet'], implies: 'Realism and calm. Window light reads as true, so it suits confession, reflection and intimate performance. It also changes through the day, so shoot the scene in one block.',
  use: ['Intimate verses', 'Interviews with no lights', 'Any scene where the audience should not notice the lighting'], avoid: ['Direct sun through the window (hard, and it moves)', 'Long shoots: the light changes by the hour'],
  practice: 'One friend, one window, one white card. Shoot at 45°, 90° and with their back to the window. Then move the card in and out.',
  quiz: { q: 'What makes a window a soft light?', opts: ['It is a very large source', 'It is bright', 'It is cool in colour'], a: 0, why: 'Size relative to the subject is what softens light, and a window is huge.' },
  pairs: ['l-hardsoft', 'l-rembrandt', 'l-mixed'], refs: [['Vermeer\'s paintings', 'the original window-left key'], ['Moonlight (2016)', 'window and practical interiors']],
  beats: [[0, 'Subject beside a window, turned 60° to it.'], [.3, 'Huge soft source: gentle shadow edges, a natural look.'], [.55, 'White card on the dark side: the ratio drops.'], [.8, 'Swap for a black card: the shadow deepens again.']],
  lights: [WIN({ angle: 65 }), FILL({ angle: -60, power: [[0, 0], [.5, 0], [.6, .35], [.75, .35], [.85, 0]] })], env: { wallDist: 2.4, window: { x: 2.0, z: .9 }, ambient: .05 },
  notes: [{ k: 'text', t: [.05, .5], text: 'Window = a free, giant softbox' }, { k: 'text', t: [.55, .75], text: 'White card: fill' }, { k: 'text', t: [.8, 1], text: 'Black card: deeper shadow', col: 'or' }] },
{ id: 'l-practical', name: 'Practical-motivated', abbr: 'PRAC', cat: 'Motivated', dur: 7, kind: 'light',
  tags: { mood: ['intimate', 'warm', 'dreamy'], use: ['performance', 'dialogue', 'night'], gear: ['practical', 'one LED'], level: 'intermediate' },
  summary: 'A lamp in frame is the "reason". Your LED, matched to it, does the real work.', lede: 'A practical is a light the audience can see: a lamp, a neon sign, a phone screen. Motivated lighting means your real key comes from the same direction and colour as that practical, so the audience believes the lamp is doing the work. The lamp sells it; the LED lights it.',
  how: ['Place the practical in frame, on the key side.', 'Put your LED just out of frame on the same side, gelled or dialled to match the lamp\'s colour (a tungsten bulb is about 2700K).', 'Dim the practical so it does not blow out; it only needs to glow.', 'Keep the LED soft and slightly higher than the lamp so it feels like the lamp\'s spill.'],
  reads: ['Warmth', 'Intimacy', 'Night'], implies: 'A believable world. Motivated light makes a set feel like a place, and a warm practical says night, home, intimacy.',
  use: ['Bedroom and living-room performance', 'Night interiors', 'Any scene where a lamp or sign can be in shot'], avoid: ['Letting the practical itself be the only light (it will be too dim or too hot)'],
  practice: 'Lamp in frame, LED off. Film. Then LED on at 2700K from the lamp\'s side. Film. Then LED at 5600K. The mismatch in the third take is the lesson.',
  quiz: { q: 'What does "motivated" mean here?', opts: ['The key mimics the direction and colour of a visible source', 'The lighting is very bright', 'The subject is motivated to perform'], a: 0, why: 'The visible practical justifies where the real light comes from.' },
  pairs: ['l-window', 'l-mixed', 'l-lowkey'], refs: [['Wong Kar-wai\'s In the Mood for Love (2000)', 'practicals motivating every interior'], ['Bedroom-pop music videos', 'fairy lights and lamps as motivation']],
  beats: [[0, 'Lamp in frame, on its own. A glow, not a key.'], [.3, 'LED on, out of frame, same side, matched to 2700K.'], [.6, 'Now the lamp looks like it is doing the work.'], [.85, 'Switch the LED to daylight: the illusion breaks.']],
  lights: [PRAC({ angle: 70, elev: -5, dist: 1.1, power: .55 }), KEY({ angle: 60, elev: 22, dist: 1.5, kelvin: [[0, 2700], [.8, 2700], [.9, 5600]], power: [[0, 0], [.25, 0], [.35, .8]] })], env: { wallDist: 1.8, ambient: .02 },
  notes: [{ k: 'text', t: [.05, .28], text: 'Practical alone: a glow' }, { k: 'text', t: [.32, .8], text: 'LED matched to the lamp: motivated' }, { k: 'text', t: [.85, 1], text: 'Daylight LED: the lamp no longer explains the light', col: 'or' }] },
{ id: 'l-mixed', name: 'Mixed colour temperature', abbr: 'MIX', cat: 'Colour', dur: 7, kind: 'light',
  tags: { mood: ['dreamy', 'reflective', 'tense'], use: ['performance', 'night', 'emotion'], gear: ['window', 'practical', 'one LED'], level: 'intermediate' },
  summary: 'Cool daylight on one side, warm tungsten on the other. Contrast from colour, not just brightness.', lede: 'Real rooms mix sources: blue daylight from a window and orange light from a lamp. Set white balance for one and the other shifts colour. Used on purpose, a cool key and a warm fill (or the reverse) give the face colour contrast that reads instantly as cinematic.',
  how: ['Set white balance to daylight (5600K). The window stays neutral, the lamp goes orange.', 'Or set it to tungsten (3200K): the lamp goes neutral, the window goes blue.', 'Aim for one dominant colour and one accent. Two equal colours fight.', 'Your LED can be either colour, so it can play the window or the lamp.'],
  reads: ['Cinematic', 'Time of day', 'Tension'], implies: 'Blue and orange is the most used colour pairing in cinema because skin sits between them. Cool side/warm side says dusk, night, a decision, a threshold.',
  use: ['Dusk and blue-hour performance', 'Night interiors with a window', 'Any scene that should feel "graded" in camera'], avoid: ['Skin that goes green or magenta when the sources are fluorescent or cheap LEDs (check the CRI)'],
  practice: 'Window on one side, lamp on the other. Shoot the same frame at 3200K, 4300K and 5600K white balance. Pick the one where the face looks right and the rest looks intentional.',
  quiz: { q: 'At a daylight white balance, a tungsten lamp looks…', opts: ['Orange', 'Blue', 'Neutral'], a: 0, why: 'Tungsten is warmer than the 5600K reference, so it renders orange.' },
  pairs: ['l-window', 'l-practical', 'l-colourrim'], refs: [['Blade Runner (1982)', 'cool key, warm practicals'], ['Countless posters', 'teal and orange']],
  beats: [[0, 'Window key, cool. White balance at daylight.'], [.3, 'A tungsten lamp comes up on the other side: orange.'], [.6, 'Cool face, warm edge. Colour contrast, not just light and dark.'], [.85, 'Flip the balance to tungsten: the lamp goes neutral and the window goes blue.']],

{ id: 'l-colourrim', name: 'Coloured rim', abbr: 'CRIM', cat: 'Colour', dur: 7, kind: 'light',
  tags: { mood: ['energetic', 'dreamy', 'dramatic'], use: ['performance', 'night'], gear: ['one LED', 'second light', 'gel'], level: 'intermediate' },
  summary: 'A neutral key plus a saturated back light. The music-video staple.', lede: 'Keep the face natural with a soft, neutral key, and put all the colour into the back light: magenta, cyan, red, whatever the song is. The rim reads as mood while skin stays believable. It is the single most common music-video lighting idea.',
  how: ['Key: softbox, neutral, fairly low power so the colour can compete.', 'Back light: a second light with a gel or an RGB setting, hard, behind and above on the opposite side.', 'Keep the colour off the face, or only just kissing the cheek.', 'Add haze and the coloured beam fills the frame.'],
  reads: ['Mood', 'Energy', 'Style'], implies: 'Whatever the colour says: red for heat and danger, cyan for cold and tech, magenta for night and desire. The neutral face keeps it human.',
  use: ['Chorus performance', 'Night club and street energy', 'Giving a plain room a look'], avoid: ['Colour on the face by accident (green rims make skin look ill)'],
  practice: 'Neutral key. Cycle the rim through red, cyan and magenta. Watch which one the song wants.',
  quiz: { q: 'Why keep the key neutral?', opts: ['So skin stays believable while the rim carries the mood', 'Because coloured keys are expensive', 'To save battery'], a: 0, why: 'A coloured key makes skin look wrong; colour on the edges reads as style.' },
  pairs: ['l-rim', 'l-mixed', 'l-haze'], refs: [['Most modern pop and rap videos', 'neutral key, coloured back light'], ['Drive (2011)', 'magenta and cyan rims']],
  beats: [[0, 'Soft neutral key, low.'], [.25, 'Magenta rim from behind: an edge of colour on hair and shoulder.'], [.5, 'Cycle to cyan. Same setup, different song.'], [.78, 'Haze up: the beam becomes the background.']],
